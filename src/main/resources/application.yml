application:
  ernestotech:
    azure:
      key-vault:
        endpoint: https://kvernestotech2.vault.azure.net/
        clientId: ${AZURE_APP_CLIENT_ID}
        clientSecret: ${AZURE_APP_CLIENT_SECRET}
        tenantId: ${AZURE_TENANT_ID}
        secrets:
          testSecret: testSecret
          serviceBusSecret: csServiceBus
          blobStorageSecret: csBlobStorage
          appConfigurationSecret: csAppConfiguration
      service-bus:
        queue: sbqueueernestotech
        namespace: sbErnestoTech.servicebus.windows.net
      app-configuration:
        blobStorageName: bsErnestoTechName